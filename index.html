/* ============================================================
   QUIZZ SVT — fichier 100% autonome (aucune dépendance)
   ------------------------------------------------------------
   CONFIGURATION ENSEIGNANT (modifiable ci-dessous) :
   - TEACHER_CODE    : code d'accès à l'espace enseignant
   - TEACHER_EMAIL   : adresse mail pré-remplie pour le bouton
                       « Envoyer par mail » de l'élève
                       (laisser "" pour masquer ce bouton)
   - SHOW_CORRECTION : true = l'élève voit la correction
   - SHEETS_URL      : URL de l'application web Google Apps
                        Script (apps-script.gs, déployé avec accès
                        « Tout le monde ») qui alimente le bouton
                        « Envoyer mes réponses au professeur ».
                        Laisser "" pour un repli téléchargement/copie
                        du code.
   ------------------------------------------------------------
   PARCOURS ÉLÈVE : quiz → « Terminer » (réponses verrouillées)
   → « Envoyer mes réponses au professeur » (POST JSON vers
   Google Sheets : une ligne par élève, redépôt remplacé).
   FORMAT DES RÉPONSES (NDJSON, 1 ligne JSON, ~150 octets) :
   {"v":1,"quiz":"eb01","s":"Nom","c":"Classe","a":[0,1,2,...],"t":"date"}
   Les réponses « a » sont les numéros (0-3) des propositions
   dans l'ordre ORIGINEL du corrigé (indépendant du mélange
   affiché à l'élève) : directement exploitables en base.
   GitHub Pages : déposer ce fichier (index.html) à la racine,
   lien direct vers un quiz : index.html?quiz=eb05
   Espace enseignant : bouton en bas de page ou index.html?prof=1
   ============================================================ */
const TEACHER_CODE = "quizzsvt2027";
const TEACHER_EMAIL = "";
const SHOW_CORRECTION = true;
const SHEETS_URL = "https://script.google.com/macros/s/AKfycbz2BsvbdMIxwmc2UOKRSPrsO3YQ2OwGUznpyL6alDkx9h8J9gLNLLd-BSqaAhv172izWA/exec";
/* ================= QUESTIONS — 10 QCM par ebook ================= */
/* q: question · o: propositions · a: index de la bonne réponse · e: explication */

const Q01 = [
{q:"Quelle est la différence entre la lithosphère et l'asthénosphère ?",o:["La lithosphère est une enveloppe rigide et cassante, alors que l'asthénosphère est solide mais ductile (déformable)","La lithosphère est liquide et l'asthénosphère est gazeuse","La lithosphère est située sous l'asthénosphère","L'asthénosphère est la couche la plus externe de la Terre"],a:0,e:"La lithosphère (environ 100 km d'épaisseur) est rigide et découpée en plaques ; l'asthénosphère, située dessous, est plus chaude et ductile, ce qui permet le déplacement des plaques."},
{q:"À quelle vitesse les plaques tectoniques se déplacent-elles ?",o:["De 1 à 10 m par an","De 1 à 10 cm par an","De quelques micromètres par siècle","Les plaques sont immobiles depuis des millions d'années"],a:1,e:"Les plaques se déplacent de 1 à 10 cm par an, ce que l'on mesure aujourd'hui grâce au GPS."},
{q:"Que se passe-t-il au niveau des dorsales océaniques ?",o:["Les plaques entrent en collision et forment des montagnes","Une plaque s'enfonce sous une autre","Les plaques s'écartent (divergence) et un nouveau plancher océanique est créé","Il ne se passe rien : c'est une zone inactive"],a:2,e:"À l'écartement des plaques, au niveau des dorsales, la lave sous-marine refroidit et forme un nouveau plancher océanique."},
{q:"Comment appelle-t-on l'enfoncement d'une plaque océanique dense sous une autre plaque ?",o:["La divergence","La collision","La sédimentation","La subduction"],a:3,e:"La subduction se produit au niveau des fosses sous-marines : une plaque océanique dense plonge sous une autre plaque, formant fosses, séismes et volcans explosifs."},
{q:"Les Alpes et l'Himalaya sont des chaînes de montagnes formées par...",o:["La collision de deux continents","L'écartement de deux plaques au niveau d'une dorsale","L'érosion par les glaciers","Des éruptions volcaniques explosives"],a:0,e:"La convergence de deux plaques continentales empile les roches : c'est la collision, à l'origine des grandes chaînes comme les Alpes et l'Himalaya."},
{q:"Le point situé à la surface du sol, à la verticale du foyer d'un séisme, s'appelle...",o:["Le foyer","L'épicentre","La faille","L'hypocentre"],a:1,e:"Le foyer (ou hypocentre) est le lieu de la rupture en profondeur ; l'épicentre est le point en surface à sa verticale, où les secousses sont maximales."},

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 2600);
}
function downloadFile(name, content, mime) {
  const b = new Blob(["\ufeff" + content], { type: (mime || "application/octet-stream") + ";charset=utf-8" });
  const u = URL.createObjectURL(b);
  const a = document.createElement("a");
  a.href = u; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 4000);
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function slug(s) {
  return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9]+/g, "-").replace(/^-+|-+$/g, "").toLowerCase() || "eleve";
}
/* === ENVOI ÉLÈVE → GOOGLE SHEETS (Apps Script, sans jeton) ===
   POST JSON vers SHEETS_URL (application web déployée « Tout le
   monde »). Le script apps-script.gs ajoute/remplace la ligne de
   l'élève dans la feuille « Réponses ». Repli : téléchargement. */
function sendToSheets(jsonLine, cb) {
  cb = cb || function () {};
  if (!SHEETS_URL) { cb(false); return; }
  fetch(SHEETS_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: jsonLine
  }).then(function () { cb(true); }).catch(function () { cb(false); });
}

function runStudentApp(root, quiz, opts) {
  opts = Object.assign({ correction: true, askName: true, mail: "", standalone: false }, opts || {});
  const M = quiz.questions;
  const KEY = "svtq_p_" + quiz.id;
  let first = "", last = "", cls = "";
  let ord = M.map((m) => shuffle(m.o.map((_, i) => i))); // ordre affiché (mélangé), distinct par question
  let ans = M.map(() => null); // réponse en index ORIGINEL
  let idx = 0, phase = "start", score = 0, line = "", sent = false, sending = false, sendFailed = false, saved = null, prevTry = null;
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || "null");
    if (raw && Array.isArray(raw.a) && raw.a.length === M.length && Array.isArray(raw.ord) && raw.ord.every((o, i) => o.length === M[i].o.length) && raw.ts && Date.now() - raw.ts < 172800000) saved = raw;
  } catch (e) {}
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify({ fn: first, ln: last, c: cls, a: ans, i: idx, ord, ts: Date.now() })); } catch (e) {} };
  const fullDisplay = () => (first + " " + last).replace(/\s+/g, " ").trim();
  const fname = () => "quizz-" + quiz.id + "-" + slug(cls) + "-" + slug(fullDisplay()) + ".ndjson";
  const begin = () => { ans = M.map(() => null); idx = 0; ord = M.map((m) => shuffle(m.o.map((_, i) => i))); };
  const findPrevTry = () => {
    try {
      const raw = (localStorage.getItem(LS_KEY) || "").split("\n").filter(Boolean);
      for (const l of raw) {
        const o = JSON.parse(l);
        if (o && o.quiz === quiz.id && typeof o.s === "string" && o.n && o.p) {
          if (normName(o.n) === normName(first) && normName(o.p) === normName(last) && normClass(o.c) === normClass(cls)) return o;
        } else if (o && o.quiz === quiz.id && typeof o.s === "string" && !o.n && !o.p) {
          if (normName(o.s) === normName(fullDisplay()) && normClass(o.c) === normClass(cls)) return o;

    return null;
  };

    const m = M[idx];
    const rows = ord[idx].map(function (orig, pos) {
      const sel = ans[idx] === orig;
      return '<label class="opt' + (sel ? " sel" : "") + '"><input type="radio" name="svtqo" value="' + orig + '"' + (sel ? " checked" : "") + ">" +
        '<span class="ball">' + LETTERS[pos] + '</span><span class="txt">' + esc(m.o[orig]) + "</span></label>";
    }).join("");
    const last = idx === M.length - 1;
    const prevSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:17px;height:17px;flex:none"><path d="m15 18-6-6 6-6"/></svg>';
    const nextSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:17px;height:17px;flex:none"><path d="m9 6 6 6-6 6"/></svg>';
    return '<div class="quizpage">' +
      '<div class="qhead"><span class="qnum">' + esc(quiz.title) + '</span><span class="qnum" style="margin-left:auto">Question ' + (idx + 1) + " / " + M.length + "</span></div>" +
      '<div class="prog"><i style="width:' + p + '%"></i></div>' +
      '<div class="qbox"><span class="qnum">Question ' + (idx + 1) + "</span>" +
      '<p class="qtext">' + esc(m.q) + '</p><div class="opts">' + rows + "</div>" +
      '<div class="nav">' +
      '<button class="btn ghost" data-act="prev"' + (idx === 0 ? " disabled" : "") + ">" + prevSvg + " Précédent</button>" +
      '<button class="btn" data-act="next">' + (last ? "Terminer" : "Suivant") + nextSvg + "</button>" +
      "</div></div>" +
      '<p class="hint" style="text-align:center;margin-top:12px">' + esc(fullDisplay()) + " · " + esc(cls) + "</p></div>";
  }

  function vRes() {
    const pct = M.length ? Math.round((100 * score) / M.length) : 0;
    const col = pct >= 70 ? "#16a34a" : pct >= 40 ? "#d97706" : "#dc2626";
    const C = 2 * Math.PI * 52;
    const verdict = pct >= 80 ? "Excellent travail !" : pct >= 60 ? "Bien joué !" : pct >= 40 ? "Passable, continue !" : "À revoir, courage !";
    let recap = "";
    if (opts.correction) {
      recap = '<div class="recap">' + M.map(function (m, i) {
        const ok = ans[i] === m.a;
        return '<div class="rline ' + (ok ? "ok" : "ko") + '">' +
          '<div class="rq"><b>Q' + (i + 1) + "</b> <span class=\"ic\">" + (ok ? IC.check : IC.x) + "</span> " + esc(m.q) + "</div>" +
          '<div class="rr">Ta réponse : <b class="' + (ok ? "okc" : "koc") + '">' + (ans[i] == null ? "aucune" : LETTERS[ord[i].indexOf(ans[i])] + " — " + esc(m.o[ans[i]])) + "</b><br>" +
          "Bonne réponse : <b class=\"okc\">" + LETTERS[ord[i].indexOf(m.a)] + " — " + esc(m.o[m.a]) + "</b></div>" +
          '<div class="expl">' + esc(m.e || "") + "</div></div>";
      }).join("") + "</div>";
    }
    const mailHref = "mailto:" + encodeURIComponent(opts.mail) +
      "?subject=" + encodeURIComponent("Quizz SVT " + quiz.n + " - " + cls + " - " + fullDisplay()) +
      "&body=" + encodeURIComponent(line + "\n\n(Fichier NDJSON : dépose ce texte dans un fichier .ndjson si le téléchargement est impossible.)");
    const prevBox = prevTry
      ? '<div class="tryline"><span class="who">Dépôt précédent</span><span class="meta">tentative n°' + (prevTry.k || 1) + " · " + scoreOf(prevTry) + "/" + M.length + "</span><span class=\"meta\">Le nouveau dépôt remplacera cette ligne.</span></div>"
      : "";
    /* Bouton d'envoi selon l'état : envoyé / envoi en cours / prêt */
    let sendBtn;
    if (sent) sendBtn = '<button class="btn ok" disabled>' + IC.check + " Réponses envoyées au professeur</button>";
    else if (sending) sendBtn = '<button class="btn ok" disabled>Envoi en cours…</button>';
    else {
      sendBtn = '<button class="btn ok" data-act="send">' + IC.up + " Envoyer mes réponses au professeur</button>" +
        (sendFailed ? '<p class="hint" style="margin:6px 0 0;width:100%;color:#dc2626">Échec de l\'envoi. Vérifie ta connexion puis réessaie, ou transmets le code ci-dessous à ton professeur.</p>' : "");
    }
    const sendControls = opts.standalone
      ? '<div class="sendbox"><h4>Envoie tes réponses à ton professeur</h4>' +
        '<div class="actions">' +
        '<button class="btn ok" data-act="dl">' + IC.dl + " Télécharger mes réponses</button>" +
        '<button class="btn ghost" data-act="copy">' + IC.copy + " Copier le code</button>" +
        (opts.mail ? '<a class="btn" href="' + mailHref + '">' + IC.mail + " Envoyer par mail</a>" : "") +
        "</div>" +
        '<textarea id="r-code" class="codebox" readonly rows="3">' + esc(line) + "</textarea></div>"
      : (SHEETS_URL
        ? '<div class="sendbox"><h4>Envoie tes réponses au professeur</h4>' +
          '<p class="hint" style="margin:0 0 10px">Tes réponses sont verrouillées : elles ne peuvent plus être modifiées.</p>' +
          '<div class="actions">' + sendBtn +
          '<button class="btn ghost" data-act="dl">' + IC.dl + " Télécharger (secours)</button>" +
          "</div>" +
          '<p class="hint" style="margin:10px 0 0">Si l\'envoi échoue, transmets ce code à ton professeur :</p>' +
          '<textarea id="r-code" class="codebox" readonly rows="3">' + esc(line) + "</textarea></div>"
        : '<div class="sendbox"><h4>Envoie tes réponses à ton professeur</h4>' +
          '<div class="actions">' +
          '<button class="btn ok" data-act="dl">' + IC.dl + " Télécharger mes réponses</button>" +
          '<button class="btn ghost" data-act="copy">' + IC.copy + " Copier le code</button>" +
          (opts.mail ? '<a class="btn" href="' + mailHref + '">' + IC.mail + " Envoyer par mail</a>" : "") +
          "</div>" +
          '<textarea id="r-code" class="codebox" readonly rows="3">' + esc(line) + "</textarea></div>");
    return '<div class="quizpage"><div class="reshead">' +
      '<div class="ringwrap"><svg width="150" height="150" viewBox="0 0 120 120">' +
      '<circle cx="60" cy="60" r="52" fill="none" stroke="#e2e8f0" stroke-width="11"/>' +
      '<circle cx="60" cy="60" r="52" fill="none" stroke="' + col + '" stroke-width="11" stroke-linecap="round" stroke-dasharray="' + C + '" stroke-dashoffset="' + (C * (1 - score / Math.max(1, M.length))) + '"/></svg>' +
      '<div class="ringtxt"><span class="big">' + score + "/" + M.length + '</span><span class="sm">' + pct + "% de réussite</span></div></div>" +
      '<div class="verdict" style="color:' + col + '">' + verdict + "</div>" +
      '<p class="hint">' + esc(fullDisplay()) + " · " + esc(cls) + " · " + esc(quiz.title) + "</p></div>" +
      recap + prevBox + sendControls +
      '<div class="actions" style="justify-content:center;margin-top:16px">' +
      '<button class="btn ghost" data-act="again">' + IC.redo + ' Recommencer</button>' +
      (!opts.standalone ? '<button class="btn ghost" data-act="home">' + IC.home + " Retour à l\'accueil</button>" : "") +
      "</div></div>";
  }

  function render() {
    root.innerHTML = phase === "start" ? vStart() : phase === "run" ? vRun() : vRes();
    root.querySelectorAll("[data-act]").forEach(function (el) {
      el.addEventListener("click", function () {
        const act = el.getAttribute("data-act");
        if (act === "begin") {
          const fi = root.querySelector("#s-first"), la = root.querySelector("#s-last"), cl = root.querySelector("#s-cls");
          first = (fi.value || "").trim(); last = (la.value || "").trim(); cls = (cl.value || "").trim();
          if (first.length < 2) { toast("Indique ton prénom."); fi.focus(); return; }
          if (last.length < 2) { toast("Indique ton nom."); la.focus(); return; }
          if (!cls) { toast("Indique ta classe."); cl.focus(); return; }
          prevTry = findPrevTry();
          begin(); phase = "run"; persist(); render();
        } else if (act === "resume" && saved) {
          first = saved.fn || (saved.n || "").split(" ")[0] || ""; last = saved.ln || (saved.n || "").split(" ").slice(1).join(" ") || ""; cls = saved.c || "";
          ans = saved.a.slice(); idx = Math.min(saved.i || 0, M.length - 1); ord = saved.ord;
          phase = "run"; render();
        } else if (act === "prev") { if (idx > 0) { idx--; persist(); render(); } }
        else if (act === "next") {
          if (idx < M.length - 1) { idx++; persist(); render(); return; }
          const miss = ans.filter((v) => v == null).length;
          if (miss > 0 && !confirm(miss + " question(s) sans réponse. Vraiment terminer le quiz ?")) return;
          finish();
        } else if (act === "dl") { downloadFile(fname(), line + "\n", "application/x-ndjson"); toast("Fichier téléchargé : envoie-le à ton professeur."); }
        else if (act === "copy") {
          (navigator.clipboard ? navigator.clipboard.writeText(line) : Promise.reject()).then(
            function () { toast("Code copié ! Colle-le dans un message pour ton professeur."); },
            function () { const ta = root.querySelector("#r-code"); ta.focus(); ta.select(); document.execCommand("copy"); toast("Code copié !"); }
          );
        } else if (act === "again") { phase = "start"; try { localStorage.removeItem(KEY); } catch (e) {} saved = null; sent = false; sendFailed = false; render(); }
        else if (act === "send" && !sent) {
          sending = true; render();
          sendToSheets(line, function (ok) {
            sending = false; sent = ok; if (!ok) sendFailed = true;
            if (ok) toast("Réponses envoyées au professeur — merci !");
            else toast("Échec de l'envoi. Réessaie ou utilise le téléchargement.");
            render();
          });
        }
        else if (act === "home") { renderHome(); }
      });
    });
    if (phase === "run") {
      root.querySelectorAll('input[name="svtqo"]').forEach(function (r) {
        r.addEventListener("change", function () { ans[idx] = parseInt(r.value, 10); persist(); render(); });
      });
    }
    if (phase === "start") {
      const fi = root.querySelector("#s-first"), la = root.querySelector("#s-last"), cl = root.querySelector("#s-cls");
      [fi, la, cl].forEach(function (i) { i.addEventListener("keydown", function (e) { if (e.key === "Enter") root.querySelector('[data-act="begin"]').click(); }); });
      fi.focus();
    }
  }

  function finish() {
    score = ans.reduce(function (acc, v, i) { return acc + (v === M[i].a ? 1 : 0); }, 0);
    prevTry = findPrevTry();
    const k = prevTry ? (prevTry.k || 1) + 1 : 1;
    line = JSON.stringify({ v: 2, quiz: quiz.id, p: first, n: last, c: cls, k: k, a: ans, t: new Date().toISOString() });
    try { localStorage.removeItem(KEY); } catch (e) {}
    phase = "res"; render();
  }
  render();
}

/* --- Stockage local des résultats (import élève/enseignant) --- */
function loadResults() {
  let out = [];
  try {
    const raw = (localStorage.getItem(LS_KEY) || "").split("\n").filter(Boolean);
    for (const l of raw) {
      const o = JSON.parse(l);
      if (o && o.quiz && byId(o.quiz) && Array.isArray(o.a) && o.a.length === byId(o.quiz).questions.length && (typeof o.s === "string" || (typeof o.p === "string" && typeof o.n === "string"))) out.push(o);
    }
  } catch (e) {}
  return out;
}
function saveResults(arr) { try { localStorage.setItem(LS_KEY, arr.map((o) => JSON.stringify(o)).join("\n")); } catch (e) {} }
function importResultLine(l, list) {
  try {
    const o = JSON.parse(l);
    if (o && o.quiz && byId(o.quiz) && typeof o.s === "string" && Array.isArray(o.a) && o.a.length === byId(o.quiz).questions.length) {
      if (list.findIndex((r) => r.quiz === o.quiz && r.s === o.s && r.t === o.t) < 0) list.push(o);
    }
  } catch (e) {}
}
function scoreOf(r) { const qz = byId(r.quiz); return r.a.reduce((acc, v, i) => acc + (v === qz.questions[i].a ? 1 : 0), 0); }
function normClass(c) { return String(c || "").trim().toUpperCase().replace(/\s+/g, " "); }
function normName(s) { return String(s || "").trim().toLowerCase().replace(/\s+/g, " ").normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
/* Identité d'un dépôt : élève (prénom/nom v2, ou s v1) + quiz. Retourne une clé normalisée. */
function resultKey(o) {
  const quiz = o.quiz || "";
  if (o.n && o.p) return quiz + "|" + normName(o.p) + "|" + normName(o.n) + "|" + normClass(o.c);
  return quiz + "|" + normName(o.s || "") + "||" + normClass(o.c);
}
/* Deux dépôts sont identiques s'ils concernent le même élève/quiz avec les mêmes réponses et la même date */
function sameDeposit(a, b) {
  try {
    return (a.t || "") === (b.t || "") && JSON.stringify(a.a) === JSON.stringify(b.a) && resultKey(a) === resultKey(b);
  } catch (e) { return false; }
}
/* Import d'une ligne NDJSON (v1 ou v2) avec FUSION : un nouveau dépôt du même élève
   sur le même quiz remplace l'ancien, incrémente le compteur k et conserve l'historique.
   Réimporter exactement le même dépôt (ex : re-chargement du Sheet) ne crée PAS un
   nouveau dépôt : la ligne est conservée telle quelle (marqueur _dup). */
function importResultLine(l, list) {
  try {
    const o = JSON.parse(l);
    if (o && o.quiz && byId(o.quiz) && Array.isArray(o.a) && o.a.length === byId(o.quiz).questions.length) {
      const key = resultKey(o);
      const prevIdx = list.findIndex((r) => resultKey(r) === key);
      if (prevIdx >= 0) {
        const prev = list[prevIdx];
        if (sameDeposit(prev, o)) {
          const kept = Object.assign({}, o, { k: Math.max(prev.k || 1, o.k || 1), h: prev.h || [] });
          kept._dup = true; delete kept._delta;
          list[prevIdx] = kept;
        } else {
          const prevScore = scoreOf(prev), newScore = scoreOf(o);
          const hist = (prev.h || []).concat([{ t: prev.t || o.t, s: prevScore }]);
          if (hist.length > 20) hist.shift();
          const merged = Object.assign({}, o, { k: Math.max(prev.k || 1, 1) + 1, h: hist });
          list[prevIdx] = merged;
          merged._delta = newScore - prevScore; delete merged._dup;
        }
      } else {
        list.push(Object.assign({}, o, { k: o.k || 1 }));
      }
    }
  } catch (e) {}
}
function fullNameOf(r) { return (r.p && r.n) ? (r.p + " " + r.n) : (r.s || "?"); }

  else if (T.tab === "keys") el.innerHTML = tKeys();
  else if (T.tab === "links") el.innerHTML = tLinks();
  else el.innerHTML = tData();
}

/* ---------- Onglet Résultats ---------- */
function tStats() {
  const R = T.results;
  const quizzes = QUIZZES.filter((q) => q.questions.length);
  const classes = [...new Set(R.map((r) => normClass(r.c)))].sort();
  const sel = R.filter((r) => (T.selQuiz === "all" || r.quiz === T.selQuiz) && (T.selClass === "all" || normClass(r.c) === T.selClass));
  const qsel = '<select data-act="selquiz"><option value="all">Tous les quiz</option>' + quizzes.map((q) => '<option value="' + q.id + '"' + (T.selQuiz === q.id ? " selected" : "") + ">Quiz " + q.n + " — " + esc(q.title) + "</option>").join("") + "</select>";
  const csel = '<select data-act="selclass"><option value="all">Toutes les classes</option>' + classes.map((c) => '<option value="' + esc(c) + '"' + (T.selClass === c ? " selected" : "") + ">" + esc(c) + "</option>").join("") + "</select>";
  let head = '<div class="controls no-print">' + qsel + csel +
    '<button class="btn ghost sm" data-act="exportcsv">' + IC.dl + " Export CSV</button>" +
    '<button class="btn ghost sm" data-act="print">' + IC.print + " Imprimer</button></div>";
  if (!R.length) {
    return head + '<div class="tpanel"><h3>Aucun résultat pour l\'instant</h3><p class="empty">Importez les fichiers de réponses des élèves (<code>.ndjson</code>) dans l\'onglet « Données », en les glissant dans la zone prévue.</p></div>';
  }
  if (!sel.length) return head + '<div class="tpanel"><p class="empty">Aucun résultat pour ce filtre.</p></div>';
  const avgPct = Math.round(100 * sel.reduce((a, r) => a + scoreOf(r) / byId(r.quiz).questions.length, 0) / sel.length);
  const stats = '<div class="statgrid">' +
    '<div class="stat"><div class="v">' + sel.length + '</div><div class="l">réponse(s) d\'élève(s)</div></div>' +
    '<div class="stat"><div class="v">' + avgPct + '%</div><div class="l">réussite moyenne</div></div>' +
    '<div class="stat"><div class="v">' + classes.length + '</div><div class="l">classe(s)</div></div></div>';
  const gCounts = levelCounts(sel);
  const groupsPanel = '<div class="tpanel"><h3>Groupes de niveau (filtres appliqués)</h3><div class="piebox">' + pieSVG(gCounts, 150) + pieLegend(gCounts, sel.length) + '</div>' +
    '<h3 style="margin-top:16px">Répartition des scores</h3>' + scoreHisto(sel) + '</div>';
  const clsPanels = classPanels(sel);
  let perQuiz = "";
  if (T.selQuiz === "all") {
    const rows = quizzes.map((q) => {
      const rs = sel.filter((r) => r.quiz === q.id);
      if (!rs.length) return "";
      const pct = Math.round(100 * rs.reduce((a, r) => a + scoreOf(r) / q.questions.length, 0) / rs.length);
      return '<tr><td>Quiz ' + q.n + "</td><td>" + esc(q.title) + "</td><td>" + rs.length + "</td><td><b>" + pct + "%</b></td></tr>";
    }).join("");
    perQuiz = '<div class="tpanel"><h3>Réussite par quiz</h3><div class="tblwrap"><table class="dt"><tr><th>Quiz</th><th>Titre</th><th>Réponses</th><th>Moyenne</th></tr>' + rows + "</table></div></div>";
  }
  const qz = T.selQuiz !== "all" ? byId(T.selQuiz) : null;
  let perQ = "";
  if (qz) {
    const rs = sel.filter((r) => r.quiz === qz.id);
    if (rs.length) {
      const bars = qz.questions.map(function (m, i) {
        const n = rs.reduce((a, r) => a + (r.a[i] === m.a ? 1 : 0), 0);
        const pct = Math.round(100 * n / rs.length);
        const cls = pct >= 70 ? "f-ok" : pct >= 40 ? "f-mid" : "f-ko";
        return '<div class="qbar"><div class="lbl"><b>Q' + (i + 1) + "</b><span>" + esc(m.q.slice(0, 80)) + (m.q.length > 80 ? "…" : "") + '</span></div>' +
          '<div class="track"><div class="fill ' + cls + '" style="width:' + pct + '%"></div></div>' +
          '<div class="pct">' + pct + "% de réussite (" + n + "/" + rs.length + ')</div></div>';
      }).join("");
      perQ = '<div class="tpanel"><h3>Taux de réussite par question — ' + esc(qz.title) + '</h3>' +
        (rs.length ? '<div class="qbars">' + bars + '</div><p class="note">Les barres rouges signalent les notions à reprendre en classe.</p>' : '<p class="empty">Aucune réponse à ce quiz pour l\'instant.</p>') + "</div>";
    }
  }
  const rows = sel.slice().sort(function (a, b) { return (normClass(a.c) + fullNameOf(a)).localeCompare(normClass(b.c) + fullNameOf(b)) || (b.t || "").localeCompare(a.t || ""); }).map(function (r) {
    const sc = scoreOf(r), qz = byId(r.quiz);
    const pct = Math.round(100 * sc / qz.questions.length);
    const lv = lvlOfPct(pct);
    const d = r.t ? new Date(r.t) : null;
    const k = r.k || 1;
    const kBadge = k > 1 ? ' <span class="badge2">' + k + " dépôt" + (k > 1 ? "s" : "") + "</span>" : "";
    return "<tr><td>" + esc(r.p || "") + "</td><td>" + esc(r.n || "") + "</td><td>" + esc(r.c) + "</td><td>Quiz " + qz.n + "</td>" +
      '<td><div class="donutcell">' + donutSVG(pct, 34, LVLCOLORS[lv]) + "<b>" + sc + "/" + qz.questions.length + "</b></div></td>" +
      '<td><span class="lvlbadge lvl' + lv + '">' + LVLNAMES[lv] + "</span></td>" +
      "<td>" + pct + "%</td><td>" + k + kBadge + "</td><td>" + (d ? d.toLocaleDateString("fr-FR") : "") + "</td></tr>";
  }).join("");
  const table = '<div class="tpanel"><h3>Réponses des élèves</h3><div class="tblwrap"><table class="dt"><tr><th>Prénom</th><th>Nom</th><th>Classe</th><th>Quiz</th><th>Score</th><th>Niveau</th><th>%</th><th>Dépôts</th><th>Date</th></tr>' + rows + "</table></div></div>";
  return head + stats + groupsPanel + clsPanels + perQuiz + perQ + table;
}

function tKeys() {

  const id = T.selQuiz !== "all" ? T.selQuiz : (quizzes[0] ? quizzes[0].id : null);

/* ---------- Actions enseignant ---------- */
function csvOf(results) {
  const head = "prenom;nom;classe;quiz;score;total;pct;depots;date;reponses";
  const lines = results.map(function (r) {
    const qz = byId(r.quiz), sc = scoreOf(r);
    const pct = Math.round(100 * sc / qz.questions.length);
    const ans = r.a.map((v) => v == null ? "-" : (v + 1)).join(",");
    const d = r.t ? new Date(r.t).toISOString() : "";
    return [r.p || r.s || "", r.n || "", r.c, "Quiz " + qz.n, sc, qz.questions.length, pct, r.k || 1, d, ans].map((x) => '"' + String(x).replace(/"/g, '""') + '"').join(";");
  });
  return head + "\n" + lines.join("\n");
}

function wireTeacher() {

}

function installTeacherEvents() {
  document.addEventListener("click", function (e) {
    if (sessionStorage.getItem("svtq_t") !== "1") return; // espace enseignant actif seulement
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const act = el.getAttribute("data-act"), val = el.getAttribute("data-val");
    if (act === "home" || act === "lock") { try { sessionStorage.removeItem("svtq_t"); } catch (err) {} history.pushState(null, "", location.pathname); renderHome(); }
    else if (act === "tab") { T.tab = val; renderTeacher(); }
    else if (act === "print") { window.print(); }
    else if (act === "dlpdf") { window.print(); }
    else if (act === "exportcsv") { const sel = filterSel(); if (sel.length) downloadFile("resultats-quizz-svt.csv", csvOf(sel), "text/csv"); }
    else if (act === "exportcsvdata") { if (T.results.length) downloadFile("base-reponses-svt.csv", csvOf(T.results), "text/csv"); }
    else if (act === "exportall") { if (T.results.length) downloadFile("reponses-svt.ndjson", T.results.map((o) => JSON.stringify(o)).join("\n") + "\n", "application/x-ndjson"); }
    else if (act === "copylink") {
      (navigator.clipboard ? navigator.clipboard.writeText(val) : Promise.reject()).then(
        function () { toast("Lien copié !"); },
        function () { toast("Copie impossible : notez le lien manuellement."); }
      );
    } else if (act === "openlink") { window.open(val, "_blank"); }
    else if (act === "dlhtml") { const qz = byId(val); downloadFile("quizz-svt-" + qz.n + "-" + slug(qz.title) + ".html", buildStandaloneHTML(qz), "text/html"); toast("Quiz " + qz.n + " exporté en HTML autonome."); }
    else if (act === "del") { T.results.splice(+val, 1); saveResults(T.results); renderTPanel(); }
    else if (act === "clearall") { if (confirm("Effacer TOUTES les réponses enregistrées dans ce navigateur ?")) { T.results = []; saveResults([]); renderTPanel(); } }
    else if (act === "pastemodal") { openPasteModal(); }
    else if (act === "ghload") { loadFromGoogleSheets(); }
  });
  document.addEventListener("change", function (e) {
    if (sessionStorage.getItem("svtq_t") !== "1") return;
    const el = e.target.closest ? e.target.closest("[data-act]") : null;
    if (!el) return;
    const act = el.getAttribute("data-act");
    if (act === "selquiz") { T.selQuiz = el.value; renderTPanel(); }
    else if (act === "selclass") { T.selClass = el.value; renderTPanel(); }
  });
}

function filterSel() {
  return T.results.filter((r) => (T.selQuiz === "all" || r.quiz === T.selQuiz) && (T.selClass === "all" || normClass(r.c) === T.selClass));
}

/* ---------- Graphiques de résultats (SVG autonomes) ---------- */
/* Groupes de niveau : Fragile (<40%), Correct (40-69%), Très satisfaisant (>=70%) */
const LVLNAMES = ["Fragile", "Correct", "Très satisfaisant"];
const LVLCOLORS = ["#dc2626", "#d97706", "#16a34a"];
const LVLFILL = ["f-ko", "f-mid", "f-ok"];
function lvlOfPct(p) { return p >= 70 ? 2 : p >= 40 ? 1 : 0; }

/* Mini anneau de % (par élève dans le tableau) */
function donutSVG(pct, size, color) {
  const C = 2 * Math.PI * 52, p = Math.max(0, Math.min(100, pct));
  const off = (C * (1 - p / 100)).toFixed(1);
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 120 120" style="transform:rotate(-90deg);flex:none" aria-hidden="true"><circle cx="60" cy="60" r="52" fill="none" stroke="#e2e8f0" stroke-width="15"/><circle cx="60" cy="60" r="52" fill="none" stroke="' + color + '" stroke-width="15" stroke-linecap="round" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + off + '"/></svg>';
}

/* Diagramme en camembert des 3 groupes de niveau */
function pieSVG(counts, size) {
  size = size || 150;
  const R = 52, C = 75;
  const total = counts[0] + counts[1] + counts[2];
  if (!total) return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 150 150" style="flex:none"><circle cx="75" cy="75" r="52" fill="none" stroke="#e2e8f0" stroke-width="26"/></svg>';
  let a = -Math.PI / 2, s = "";
  for (let i = 0; i < 3; i++) {
    if (!counts[i]) continue;
    const a1 = a + (counts[i] / total) * Math.PI * 2;
    if (counts[i] === total) { s += '<circle cx="75" cy="75" r="52" fill="none" stroke="' + LVLCOLORS[i] + '" stroke-width="26"/>'; }
    else {
      const big = (a1 - a) > Math.PI ? 1 : 0;
      s += '<path d="M75 75 L' + (75 + R * Math.cos(a)).toFixed(1) + ' ' + (75 + R * Math.sin(a)).toFixed(1) + ' A52 52 0 ' + big + ' 1 ' + (75 + R * Math.cos(a1)).toFixed(1) + ' ' + (75 + R * Math.sin(a1)).toFixed(1) + ' Z" fill="' + LVLCOLORS[i] + '"/>';
    }
    a = a1;
  }
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 150 150" style="flex:none" role="img">' + s + '</svg>';
}
function pieLegend(counts, total) {
  return '<div class="pielegend">' + [0, 1, 2].map(function (i) {
    const p = total ? Math.round(100 * counts[i] / total) : 0;
    return '<div class="li"><span class="dot" style="background:' + LVLCOLORS[i] + '"></span><b>' + LVLNAMES[i] + '</b><span>' + counts[i] + ' élève(s) · ' + p + '%</span></div>';
  }).join("") + "</div>";
}
function levelCounts(rs) {
  const c = [0, 0, 0];
  rs.forEach(function (r) { const qz = byId(r.quiz); c[lvlOfPct(Math.round(100 * scoreOf(r) / qz.questions.length))]++; });
  return c;
}

/* Histogramme de répartition des scores (tranches de %) */
function scoreHisto(rs) {
  const edges = [0, 20, 40, 60, 80, 101], labels = ["0–19", "20–39", "40–59", "60–79", "80–100"];
  const counts = [0, 0, 0, 0, 0];
  rs.forEach(function (r) {
    const qz = byId(r.quiz), p = Math.round(100 * scoreOf(r) / qz.questions.length);
    for (let i = 0; i < 5; i++) { if (p >= edges[i] && p < edges[i + 1]) { counts[i]++; break; } }
  });
  const mx = Math.max.apply(null, counts.concat([1]));
  const cols = counts.map(function (n, i) {
    const h = Math.round(120 * n / mx), mid = (edges[i] + Math.min(edges[i + 1] - 1, 100)) / 2;
    return '<div class="col"><span class="n">' + n + '</span><div class="bar" style="height:' + h + 'px;background:' + LVLCOLORS[lvlOfPct(mid)] + '" title="' + n + ' élève(s)"></div><span class="rg">' + labels[i] + '%</span></div>';
  }).join("");
  return '<div class="histo">' + cols + '</div>';
}

/* Panneaux par classe : camembert des groupes + histogramme des élèves (triés) */
function classPanels(sel) {
  const byC = {};
  sel.forEach(function (r) { const c = normClass(r.c) || "?"; (byC[c] = byC[c] || []).push(r); });
  return Object.keys(byC).sort().map(function (c) {
    const rs = byC[c].slice().sort(function (a, b) { return scoreOf(b) - scoreOf(a); });
    const counts = levelCounts(rs);
    const avg = Math.round(100 * rs.reduce(function (s, r) { return s + scoreOf(r) / byId(r.quiz).questions.length; }, 0) / rs.length);
    const bars = rs.map(function (r) {
      const qz = byId(r.quiz), sc = scoreOf(r), p = Math.round(100 * sc / qz.questions.length), lv = lvlOfPct(p);
      return '<div class="qbar"><div class="lbl"><b style="color:#0f172a">' + esc(fullNameOf(r)) + '</b><span>Quiz ' + qz.n + ' · ' + sc + '/' + qz.questions.length + '</span></div>' +
        '<div class="track"><div class="fill ' + LVLFILL[lv] + '" style="width:' + p + '%"></div></div>' +
        '<div class="pct">' + p + '% · ' + LVLNAMES[lv] + '</div></div>';
    }).join("");
    return '<div class="tpanel"><h3>Classe ' + esc(c) + ' — ' + rs.length + ' élève(s) · moyenne ' + avg + '%</h3>' +
      '<div class="piebox">' + pieSVG(counts, 130) + pieLegend(counts, rs.length) + '</div>' +
      '<div class="qbars" style="margin-top:12px">' + bars + '</div></div>';
  }).join("");
}

/* Découpe un flux NDJSON en objets {line, o} exploitables.
   Tolérant : BOM, lignes vides, espaces, texte parasite autour de l'objet,
   et objets JSON répartis sur plusieurs lignes (accolades équilibrées).
   Retourne { ok: [...], bad: [{line, reason}] } : AUCUNE ligne n'est perdue en silence. */
function parseNDJSONStream(txt) {
  const ok = [], bad = [];
  const clean = String(txt || "").replace(/^\uFEFF/, "");
  const pushBad = function (t, reason) { if (bad.length < 50) bad.push({ line: String(t).slice(0, 140), reason: reason }); };
  const check = function (t) {
    if (!t) return;
    let cand = t;
    if (cand[0] !== "{") {
      const s = cand.indexOf("{"), e = cand.lastIndexOf("}");
      if (s < 0 || e <= s) { pushBad(t, "pas de JSON"); return; }
      cand = cand.slice(s, e + 1);
    }
    let o = null;
    try { o = JSON.parse(cand); } catch (e) { pushBad(t, "JSON illisible"); return; }
    if (!o || !o.quiz || !byId(o.quiz)) { pushBad(t, "quiz inconnu"); return; }
    if (!Array.isArray(o.a) || o.a.length !== byId(o.quiz).questions.length) { pushBad(t, "nombre de réponses incorrect"); return; }
    ok.push({ line: cand, o: o });
  };
  let buf = "";
  clean.split(/\r?\n/).forEach(function (l) {
    buf = buf ? buf + "\n" + l : l;
    const t = buf.trim();
    if (!t) { buf = ""; return; }
    try { JSON.parse(t[0] === "{" ? t : t.slice(t.indexOf("{"), t.lastIndexOf("}") + 1)); check(buf); buf = ""; }
    catch (e) {
      const open = (t.match(/\{/g) || []).length, close = (t.match(/\}/g) || []).length;
      if (open <= close) { check(buf); buf = ""; } /* illisible : on comptabilise, sinon on accumule la ligne suivante */
    }
  });
  if (buf.trim()) check(buf);
  return { ok: ok, bad: bad };
}

/* Bilan textuel d'un import : ajouts + redépôts + doublons + lignes ignorées */
function importSummary(added, merged, dups, skipped) {
  const parts = [];
  if (added) parts.push(added + " ajout(s)");
  if (merged) parts.push(merged + " redépôt(s)");
  if (dups) parts.push(dups + " déjà à jour");
  if (skipped) parts.push(skipped + " ligne(s) ignorée(s) — voir le détail ci-dessous");
  return parts.join(", ") || "Aucune donnée valide trouvée.";
}

function loadFromGoogleSheets() {
  if (!SHEETS_URL) { toast("SHEETS_URL non configuré dans index.html."); return; }
  toast("Chargement depuis Google Sheets…");
  fetch(SHEETS_URL + "?json=1")
    .then(function (r) { return r.ok ? r.text() : Promise.reject(r.status); })
    .then(function (txt) {
      /* Garde-fou : si la réponse ne contient aucun objet, ce n'est pas du NDJSON
         (déploiement obsolète, accès non « Tout le monde », mauvaise URL…) */
      if (txt.indexOf("{") < 0) { toast("Google Sheets n'a renvoyé aucune donnée. Vérifie le déploiement (accès « Tout le monde ») et SHEETS_URL."); return; }
      const parsed = parseNDJSONStream(txt);
      const list = loadResults();
      let added = 0, merged = 0, dups = 0;
      parsed.ok.forEach(function (it) {
        let prevIdx = -1;
        try { const k = resultKey(it.o); prevIdx = list.findIndex(function (r) { try { return resultKey(r) === k; } catch (e) { return false; } }); } catch (e) {}
        const prevLen = list.length;
        importResultLine(it.line, list);
        if (list.length > prevLen) added++;
        else if (prevIdx >= 0) { if (list[prevIdx]._dup) dups++; else merged++; }
      });
      T.skipped = parsed.bad;
      if (added || merged) { T.results = list; saveResults(list); }
      renderTPanel();
      toast(importSummary(added, merged, dups, parsed.bad.length) + " depuis Google Sheets.");
    })
    .catch(function () { toast("Impossible de charger Google Sheets (vérifie SHEETS_URL)."); });
}

function importFiles(files) {
  if (!files || !files.length) return;
  const list = loadResults();
  let done = 0, added = 0, merged = 0, dups = 0;
  const allBad = [];
  Array.prototype.forEach.call(files, function (f) {
    const fr = new FileReader();
    fr.onload = function () {
      const parsed = parseNDJSONStream(String(fr.result));
      parsed.bad.forEach(function (b) { if (allBad.length < 50) allBad.push(b); });
      parsed.ok.forEach(function (it) {
        let prevIdx = -1;
        try { const k = resultKey(it.o); prevIdx = list.findIndex((r) => { try { return resultKey(r) === k; } catch (e) { return false; } }); } catch (e) {}
        const prevLen = list.length;
        importResultLine(it.line, list); // la fusion gère k, h (historique) et _delta
        if (list.length > prevLen) { added++; if (it.o && it.o.quiz) depotSession.push(it.o); }
        else if (prevIdx >= 0) { if (list[prevIdx]._dup) dups++; else { merged++; if (it.o && it.o.quiz) depotSession.push(it.o); } }
      });
      done++;
      if (done === files.length) {
        saveResults(list);
        T.results = list;
        if (allBad.length) T.skipped = allBad;
        toast(importSummary(added, merged, dups, allBad.length) + ".");
        const ok = document.getElementById("drop-ok");
        if (ok && (added || merged)) { ok.style.display = "block"; ok.innerHTML = IC.check + " Dépôt enregistré — merci !"; }
        const depBox = document.querySelector(".depbox");
        if (depBox) renderDepot();
        else if (teacherUnlocked()) renderTPanel();
      }    };
    fr.readAsText(f, "utf-8");
  });
}

function openPasteModal() {
  const old = document.querySelector(".overlay"); if (old) old.remove();
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.innerHTML = '<div class="modal"><h3>Coller un code élève</h3><p class="sub">L\'élève peut vous envoyer le code texte s\'il ne peut pas télécharger le fichier.</p>' +
    '<textarea id="pcode" class="codebox" rows="4" placeholder=\'{"v":1,"quiz":"eb01",...}\'></textarea>' +
    '<div class="actions"><button class="btn" data-act="pimport">Importer</button><button class="btn ghost" data-act="pcancel">Annuler</button></div></div>';
  document.body.appendChild(ov);
  const ta = ov.querySelector("#pcode");
  ov.addEventListener("click", function (e) {
    if (e.target === ov) ov.remove();
    const el = e.target.closest && e.target.closest("[data-act]");
    if (!el) return;
    if (el.getAttribute("data-act") === "pimport") {
      const list = T.results.length ? T.results.slice() : loadResults();
      const parsed = parseNDJSONStream(ta.value);
      let added = 0, merged = 0, dups = 0;
      parsed.ok.forEach(function (it) {
        let prevIdx = -1;
        try { const k = resultKey(it.o); prevIdx = list.findIndex((r) => { try { return resultKey(r) === k; } catch (e) { return false; } }); } catch (e) {}
        const prevLen = list.length;
        importResultLine(it.line, list); // la fusion gère k, h (historique) et _delta
        if (list.length > prevLen) added++;
        else if (prevIdx >= 0) { if (list[prevIdx]._dup) dups++; else merged++; }
      });
      if (added || merged) { T.results = list; saveResults(list); renderTPanel(); ov.remove(); toast(importSummary(added, merged, dups, parsed.bad.length) + "."); }
      else if (dups && !parsed.bad.length) { ov.remove(); toast("Code déjà enregistré (aucun changement)."); }
      else { T.skipped = parsed.bad; renderTPanel(); toast("Code invalide ou déjà enregistré."); }
    }
    if (el.getAttribute("data-act") === "pcancel") ov.remove();
  });
  ta.focus();
}

/* ================= ÉVÉNEMENTS GLOBAUX & DÉMARRAGE ================= */
document.addEventListener("click", function (e) {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.getAttribute("data-act"), val = el.getAttribute("data-val");
  if (act === "start") { history.pushState(null, "", "?quiz=" + val); startQuiz(val); }
  else if (act === "teacher-open") openTeacherLogin();
  else if (act === "goto-depot") { history.pushState(null, "", "?depot=1"); renderDepot(); window.scrollTo(0, 0); }
  else if (act === "gohome") { history.pushState(null, "", location.pathname); renderHome(); }
  else if (act === "f-cycle") { homeFilter.cycle = val; renderHome(); }
  else if (act === "f-level") { homeFilter.level = val; renderHome(); }
});
/* Ouverture du sélecteur de fichiers : la zone de dépôt est publique (élève comme enseignant) */
document.addEventListener("click", function (e) {
  const dz = e.target.closest ? e.target.closest("#dropzone") : null;
  if (!dz) return;
  if (e.target.id === "fileinput") return;
  const fi = document.getElementById("fileinput");
  if (fi) fi.click();
});
document.addEventListener("keydown", function (e) {
  if (e.key !== "Enter" && e.key !== " ") return;
  const el = e.target.closest ? e.target.closest('[data-act="start"]') : null;
  if (el && el.getAttribute("data-act") === "start") { e.preventDefault(); el.click(); }
});
/* Sélecteur de fichiers de la zone de dépôt (public : élève comme enseignant) */
document.addEventListener("change", function (e) {
  if (e.target && e.target.id === "fileinput") { importFiles(e.target.files); e.target.value = ""; }
});
/* Drag & drop des fichiers de réponses (délégation document, public) */
document.addEventListener("dragover", function (e) { if (document.getElementById("dropzone")) { e.preventDefault(); document.getElementById("dropzone").classList.add("over"); } });
document.addEventListener("dragleave", function () { const dz = document.getElementById("dropzone"); if (dz) dz.classList.remove("over"); });
document.addEventListener("drop", function (e) {
  const dz = document.getElementById("dropzone");
  if (!dz) return;
  e.preventDefault(); dz.classList.remove("over");
  importFiles(e.dataTransfer.files);
});
installTeacherEvents();
window.addEventListener("hashchange", route);
route();
